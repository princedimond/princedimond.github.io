<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My IT Adventure</title>
  <style>
    /* Reset some default styles */
    body, html {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background-color: #f0f4f8;
      color: #333;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 1.8rem;
      text-align: center;
      color: #2c3e50;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
      margin-top: 2rem;
    }

    a.button {
      display: block;
      text-align: center;
      padding: 1.2rem 1rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: white;
      background-color: #007bff;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
      user-select: none;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      touch-action: manipulation;
    }

    a.button:active,
    a.button:focus {
      background-color: #0056b3;
      box-shadow: 0 2px 4px rgba(0, 86, 179, 0.6);
      outline: none;
    }

    a.button:hover {
      background-color: #0056b3;
      cursor: pointer;
    }

    /* Responsive font size for smaller screens */
    @media (max-width: 400px) {
      h1 {
        font-size: 1.5rem;
      }
      a.button {
        font-size: 1rem;
        padding: 1rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to my IT Adventure</h1>
  <div class="button-container">
    <a
      href="https://github.com/princedimond?tab=repositories"
      class="button"
      target="_blank"
      rel="noopener noreferrer"
      >My GitHub Repositories</a
    >
    <a href="resources.html" class="button">Resources</a>
    <a href="additional-info.html" class="button">Additional Information</a>
  </div>
</body>
</html>
